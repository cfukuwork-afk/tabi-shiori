# iOSアプリをGitHubのMacでビルドして、App Store Connectへ送る（Expoの無料ビルド枠を使わない）
# 実行方法：GitHubの「Actions」→「iOS build」→「Run workflow」
name: iOS build

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'ビルド後にApp Store Connectへ送る'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
      # macOSの /var は /private/var への近道（シンボリックリンク）で、ウィジェットのバンドルが
      # 2つの書き方の食い違いで失敗する。近道を含まない場所でビルドする
      EAS_LOCAL_BUILD_WORKINGDIR: /Users/runner/eas-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN が登録されていません（Settings → Secrets and variables → Actions）"
            exit 1
          fi

      - name: Install packages
        run: npm ci || npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # EASは本体アプリのビルド番号だけを上げるので、共有機能・ウィジェットの番号が1のままになる。
      # 次に付く番号を先に調べて app.json に書いておけば、全部そろう
      - name: Align build number for extensions
        run: |
          CUR=$(eas build:version:get -p ios --profile production --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.buildNumber??j.ios?.buildNumber??"")})')
          if ! [[ "$CUR" =~ ^[0-9]+$ ]]; then echo "::warning::ビルド番号を取得できなかったので、そろえずに続けます: $CUR"; exit 0; fi
          NEXT=$((CUR + 1))
          node -e 'const f="app.json";const fs=require("fs");const j=JSON.parse(fs.readFileSync(f));j.expo.ios.buildNumber=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2))' "$NEXT"
          echo "buildNumber -> $NEXT"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build (on this Mac)
        run: eas build -p ios --profile production --local --non-interactive --output "$RUNNER_TEMP/app.ipa"

      - name: Keep the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/app.ipa
          retention-days: 7

      - name: Send to App Store Connect
        if: ${{ inputs.submit }}
        run: eas submit -p ios --profile production --path "$RUNNER_TEMP/app.ipa" --non-interactive
